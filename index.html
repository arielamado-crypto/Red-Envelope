<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red Envelope</title>
<style>
:root{--bg1:#fff4ea;--bg2:#ffd9c2;--ink:#5a1414;--paper:#fffaf0;--hint:#7a2a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a0d0d;--bg2:#4a1414;--hint:#ffd9c2}}
:root[data-theme="dark"]{--bg1:#2a0d0d;--bg2:#4a1414;--hint:#ffd9c2}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 30%,var(--bg1),var(--bg2));font-family:Georgia,'Times New Roman',serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{display:flex;flex-direction:column;align-items:center;gap:28px;padding:16px}
.scale{width:320px;height:380px;position:relative;transform-origin:top center}
.env{position:absolute;left:0;bottom:0;width:320px;height:220px;cursor:pointer;perspective:900px;animation:float 3s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.open.env{animation:none}
@keyframes float{50%{transform:translateY(-8px)}}
.back{position:absolute;inset:0;background:#8f1010;border-radius:6px;box-shadow:0 18px 30px rgba(90,10,10,.35)}
.letter{position:absolute;left:20px;top:14px;width:280px;height:var(--lh,200px);background:var(--paper);border-radius:4px;z-index:2;padding:20px 18px;text-align:center;color:var(--ink);clip-path:inset(-10px -10px var(--hide,0px) -10px);transition:transform .8s cubic-bezier(.3,1.2,.4,1) .55s,clip-path .8s ease .55s;box-shadow:0 2px 8px rgba(0,0,0,.2);border:2px solid #e3b84a;outline:3px solid var(--paper);outline-offset:-8px}
.letter h2{margin:6px 0 8px;font-size:22px;color:#b01212}
.letter p{margin:0;font-size:15px;line-height:1.45}
.letter .heart{font-size:26px;margin-top:10px;display:block}
.open .letter{transform:translateY(calc(-1 * var(--lift,170px)));clip-path:inset(-10px)}
.front{position:absolute;inset:0;z-index:3;border-radius:6px;pointer-events:none}
.front i{position:absolute;inset:0;background:linear-gradient(135deg,#d41c1c,#b01212)}
.front .l{clip-path:polygon(0 0,50% 59%,0 100%);background:#c21717}
.front .r{clip-path:polygon(100% 0,50% 59%,100% 100%)}
.front .b{clip-path:polygon(0 100%,50% 59%,100% 100%);background:linear-gradient(#e02424,#c01515)}
.front .l,.front .r,.front .b{position:absolute;inset:0}
.front .r{background:#cc1a1a}
.flap{position:absolute;left:0;top:0;width:320px;height:130px;z-index:4;transform-origin:top center;transition:transform .6s ease-in-out,z-index 0s .3s;transform:rotateX(0)}
.flap i{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(#e82a2a,#c41616)}
.open .flap{transform:rotateX(180deg);z-index:1}
.flap i{filter:drop-shadow(0 4px 3px rgba(0,0,0,.3))}
.seal{position:absolute;left:50%;top:104px;width:46px;height:46px;margin-left:-23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe58a,#d9a521 70%);z-index:5;display:flex;align-items:center;justify-content:center;font-size:22px;color:#a11;box-shadow:0 3px 6px rgba(0,0,0,.35);transition:opacity .3s,transform .3s}
.open .seal{opacity:0;transform:scale(.4)}
.hint{color:var(--hint);font-size:16px;letter-spacing:.04em;text-align:center;min-height:24px}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#ffd24a;opacity:0;pointer-events:none}
.open ~ .sparks .spark{animation:pop 1.1s ease-out .6s forwards}
@keyframes pop{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}}
@media (prefers-reduced-motion:reduce){.env{animation:none}.letter,.flap{transition-duration:.01s;transition-delay:0s}}
</style>
</head>
<body>
<div class="stage">
  <div class="scale" id="scale">
    <div class="env" id="env" role="button" tabindex="0" aria-label="Open envelope" aria-pressed="false">
      <div class="back"></div>
      <div class="letter">
        <h2>A Special Message</h2>
        <p>Good morning everyone, sorry for not around while preparing for our Foundation Day. I will try my very best to be there Friday. I know my Parekoy "Welter" can do what I can. Good luck sa aton "SSES Foundation Day"</p>
        <span class="heart">&#10084;</span>
      </div>
      <div class="front"><i class="l"></i><i class="r"></i><i class="b"></i></div>
      <div class="flap"><i></i></div>
      <div class="seal">&#10084;</div>
    </div>
    <div class="sparks" id="sparks" style="position:absolute;left:160px;bottom:110px"></div>
  </div>
  <div class="hint" id="hint">Tap the envelope to open</div>
</div>
<script>
(function(){
  var env=document.getElementById('env'),hint=document.getElementById('hint'),sparks=document.getElementById('sparks'),scale=document.getElementById('scale');
  for(var i=0;i<14;i++){var s=document.createElement('span');s.className='spark';var a=Math.PI*2*i/14,d=110+Math.random()*70;s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',(Math.sin(a)*d-60)+'px');sparks.appendChild(s);}
  var letter=document.querySelector('.letter'),H=380;
  function size(){
    letter.style.height='auto';
    var h=Math.max(200,letter.offsetHeight+4);
    letter.style.height=h+'px';
    env.style.setProperty('--lift',(h-30)+'px');env.style.setProperty('--hide',Math.max(0,h-200)+'px');
    H=h+190;scale.style.height=H+'px';fit();
  }
  function fit(){var k=Math.min(1,(window.innerWidth-24)/320,(window.innerHeight-120)/H);scale.style.transform='scale('+k+')';scale.style.marginBottom=(H*(k-1))+'px';}
  window.addEventListener('resize',size);size();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(size);
  function toggle(){
    var o=env.classList.toggle('open');
    env.setAttribute('aria-pressed',o);
    hint.textContent=o?'Tap again to close':'Tap the envelope to open';
    sparks.className='sparks';
    if(o){env.parentNode.classList.add('x');}
  }
  env.addEventListener('click',toggle);
  env.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
})();
</script>
</body>
</html>
