<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Interactive Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% 30%,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);font-family:var(--body);overflow:hidden;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
#app{display:contents}
.stars{position:fixed;inset:0;pointer-events:none}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff3c8;opacity:.15;animation:tw 3s ease-in-out infinite}
.stars.on i{opacity:.35}
@keyframes tw{50%{opacity:.95;transform:scale(1.7)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.stage{display:flex;flex-direction:column;align-items:center;gap:18px;position:relative;z-index:5}
.sbw{position:relative}
.scalebox{position:absolute;left:0;top:0;width:320px;height:300px;transform-origin:top left}

/* envelope */
.env{position:absolute;left:0;top:80px;width:320px;height:220px;perspective:900px;cursor:pointer;outline:none;animation:float 3.2s ease-in-out infinite;transition:transform .9s ease,opacity .9s ease}
.go .env{animation:none}
.done .env{transform:translateY(70px) scale(.8);opacity:0;pointer-events:none}
@keyframes float{50%{transform:translateY(-8px)}}
.back{position:absolute;inset:0;background:var(--envDD);border-radius:6px;box-shadow:0 20px 34px rgba(0,0,0,.55),0 0 0 1.5px var(--trim)}
.letter{position:absolute;left:20px;top:14px;width:280px;height:200px;z-index:2;background:linear-gradient(var(--p1),var(--p2));border-radius:4px;border:2px solid var(--trim);transition:transform .9s cubic-bezier(.3,1.15,.4,1)}
.letter::after{content:'';position:absolute;left:34px;right:34px;top:70px;height:70px;background:repeating-linear-gradient(var(--ring) 0 2px,transparent 2px 14px);opacity:.6}
.go .letter{transform:translateY(-120px);transition-delay:1.05s}
.front,.flap{position:absolute;left:0;top:0;pointer-events:none}
.front{z-index:3;width:320px;height:220px}
.flap{z-index:4;width:320px;height:130px;transform-origin:top center;transition:transform .7s ease-in-out .4s,z-index 0s .7s;filter:drop-shadow(0 4px 3px rgba(0,0,0,.4))}
.flap svg{display:block}
.go .flap{transform:rotateX(180deg);z-index:1}
.closing .flap{transition:transform .7s ease-in-out .95s,z-index 0s 1s}
.seal{position:absolute;z-index:5;left:122px;top:92px;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--g2),var(--g1)) center/cover no-repeat;display:grid;place-items:center;font-size:30px;color:var(--envDD);box-shadow:0 0 0 3px var(--g2),0 0 0 5px var(--g1),0 6px 12px rgba(0,0,0,.6);transition:opacity .35s ease .4s,transform .35s ease .4s;animation:glow 2.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--g2),0 0 0 5px var(--g1),0 0 22px 6px rgba(255,215,110,.75),0 6px 12px rgba(0,0,0,.6)}}
.go .seal{opacity:0;transform:scale(.4);animation:none}
.closing .seal{transition-delay:1.75s}
.ring{position:absolute;left:122px;top:92px;width:76px;height:76px;border-radius:50%;border:3px solid var(--g2);z-index:5;opacity:0;pointer-events:none}
.go .ring{animation:ringx 1.1s ease-out forwards}
@keyframes ringx{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(5)}}
.hint{color:var(--g2);font-size:19px;letter-spacing:.05em;text-align:center;transition:opacity .5s ease 1.9s}
.go .hint{opacity:0;transition-delay:0s}

/* light */
.flash{position:fixed;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;pointer-events:none;opacity:0;z-index:20;background:radial-gradient(circle,#fff9d8 0%,rgba(255,214,110,.8) 35%,transparent 70%)}
.mode-envelope.go .flash{animation:flashx 1.5s ease-out 1.95s}
.mode-book.go .flash{animation:flashx 1.4s ease-out .6s}
@keyframes flashx{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(160)}}
.glow{position:fixed;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;z-index:2;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg,rgba(255,214,110,.13) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 42%);mask:radial-gradient(circle,#000 0,transparent 42%);animation:spin 60s linear infinite;transition:opacity .5s ease}
.go .glow{opacity:1;transition:opacity 2s ease 1s}
.mode-envelope.go .glow{transition-delay:2.1s}
.closing .glow{opacity:0;transition:opacity .4s ease}
@keyframes spin{to{transform:rotate(360deg)}}

/* the card */
.reveal{position:fixed;left:50%;top:50%;z-index:30;width:400px;min-height:540px;display:flex;margin:0;container-type:inline-size}
.mode-envelope .reveal{transform:translate(calc(-50% + var(--tx,0px)),calc(-50% + var(--ty,0px))) scale(var(--ts,.5));opacity:0;pointer-events:none;transition:transform 1s cubic-bezier(.2,1.1,.3,1) 2s,opacity .7s ease 2s}
.mode-envelope.go .reveal{transform:translate(-50%,-50%) scale(var(--k,1));opacity:1;pointer-events:auto}
.mode-envelope.closing .reveal{transform:translate(calc(-50% + var(--tx,0px)),calc(-50% + var(--ty,0px))) scale(var(--ts,.5));opacity:0;pointer-events:none;transition:transform .85s cubic-bezier(.5,0,.75,.4),opacity .5s ease .35s}
.mode-book .reveal{transform:translate(-50%,-50%) scale(var(--k,1));perspective:1800px}
.mode-book.closing .paper{opacity:0;transition:opacity .5s ease}
.paper{position:relative;flex:1;border-radius:2.4cqw;background:radial-gradient(circle at 50% 0%,var(--p1) 0%,var(--p2) 100%);box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 0 .5cqw var(--trim),0 0 8cqw rgba(255,214,110,.3);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8cqw 9cqw;gap:2.6cqw;color:var(--ink)}
.paper::after{content:'';position:absolute;inset:2.2cqw;border:.4cqw solid var(--trim);border-radius:1.4cqw;box-shadow:inset 0 0 0 1cqw var(--p1),inset 0 0 0 1.35cqw var(--ring);pointer-events:none}
.paper>*{position:relative;z-index:1}
.r{opacity:0}
.go .r{animation:rise .9s cubic-bezier(.2,.8,.25,1) var(--d) both}
@keyframes rise{0%{opacity:0;transform:translateY(4cqw) scale(.95);filter:blur(4px)}100%{opacity:1;transform:none;filter:none}}
.orn{font-size:4cqw;letter-spacing:2.4cqw;color:var(--g1)}
.logoWrap{position:relative;width:46cqw;height:46cqw;display:grid;place-items:center;margin-top:-2cqw;margin-bottom:-4cqw}
.logoWrap.small{width:30cqw;height:30cqw;margin-bottom:-1cqw}
.logo{width:26cqw;height:26cqw;border-radius:50%;background-color:#000;background-repeat:no-repeat;background-position:center;box-shadow:0 0 0 .6cqw var(--g2),0 0 0 1cqw var(--g1),0 1cqw 3cqw rgba(0,0,0,.4)}
.small .logo{width:22cqw;height:22cqw}
.go .logo{animation:lg 2.4s ease-in-out 3.2s infinite}
@keyframes lg{50%{box-shadow:0 0 0 .6cqw var(--g2),0 0 0 1cqw var(--g1),0 0 6cqw 1.5cqw rgba(255,200,70,.8)}}
.orb{position:absolute;inset:0;transform:rotate(var(--a)) scaleY(.36);pointer-events:none}
.orb b{position:absolute;inset:0;border-radius:50%;border:.35cqw solid var(--ring);animation:spin 7s linear infinite;animation-direction:var(--dir)}
.orb b::after{content:'';position:absolute;left:50%;top:-1.5cqw;width:3.2cqw;height:3.2cqw;margin-left:-1.6cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--envL) 60%);box-shadow:0 0 2cqw var(--envL)}
.h1{font-family:var(--script);font-size:15cqw;line-height:1;display:inline-block;padding:3cqw 6cqw 3.5cqw 9cqw;margin:-4cqw 0 -3cqw;background:linear-gradient(100deg,var(--g1) 10%,var(--g2) 38%,var(--g1) 58%,var(--g2) 80%,var(--g1) 95%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4.5s linear infinite}
@keyframes shine{to{background-position:-220% 0}}
.h2{font-weight:700;font-size:7cqw;letter-spacing:1cqw;text-transform:uppercase;line-height:1.1}
.role{font-style:italic;font-weight:600;font-size:4.2cqw;margin-top:-.6cqw;color:var(--g1)}
.date{display:inline-block;padding:1.2cqw 5cqw;border-radius:99px;font-weight:700;font-size:4.2cqw;letter-spacing:.5cqw;color:var(--p1);background:linear-gradient(var(--envL),var(--envD));box-shadow:0 .8cqw 1.6cqw rgba(0,0,0,.3),inset 0 0 0 .3cqw var(--trim)}
.sep{width:38cqw;height:.4cqw;background:linear-gradient(90deg,transparent,var(--trim),transparent)}
.lab{font-size:3.1cqw;letter-spacing:.9cqw;text-transform:uppercase;font-weight:700;color:var(--g1);margin-bottom:.8cqw}
.q{font-style:italic;font-weight:600;font-size:4.7cqw;line-height:1.3;margin:0}
.by{font-size:3.4cqw;font-weight:700;letter-spacing:.3cqw;color:var(--g1);margin-top:.6cqw}
.w{display:inline-block;opacity:.16;filter:blur(1.2px)}
.go .w{animation:lit .75s ease forwards;animation-delay:calc(var(--ws) + var(--i)*.2s)}
@keyframes lit{0%{opacity:.16;filter:blur(1.2px)}45%{opacity:1;filter:none;color:var(--g1);text-shadow:0 0 3cqw rgba(255,196,60,.95)}100%{opacity:1;filter:none;color:var(--ink);text-shadow:none}}
.foot{font-size:2.9cqw;letter-spacing:.35cqw;text-transform:uppercase;font-weight:700;color:var(--g1);line-height:1.5}

/* photo-card cover */
.cover{position:absolute;inset:0;z-index:5;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.7s cubic-bezier(.62,0,.22,1),opacity .5s ease;cursor:pointer;outline:none}
.cover.gone{opacity:0;visibility:hidden;transition:opacity .5s ease,visibility 0s .5s}
.go .cover{transform:rotateY(-174deg);pointer-events:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:2.4cqw;overflow:hidden}
.cfront{background:linear-gradient(160deg,var(--env),var(--envDD)) center/cover no-repeat;box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 0 .5cqw var(--trim);display:flex;align-items:center;justify-content:center;text-align:center}
.cfront .ft{font-family:var(--script);font-size:18cqw;line-height:1;color:var(--g2);padding:0 8cqw;text-shadow:0 .6cqw 2cqw rgba(0,0,0,.5)}
.cfront::before{content:'';position:absolute;inset:0;z-index:2;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.35) 50%,transparent 62%);transform:translateX(-130%);animation:sheen 4.2s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.cfront::after{content:'';position:absolute;inset:1.6cqw;z-index:3;border:.55cqw solid var(--g2);border-radius:1.4cqw;box-shadow:0 0 2cqw rgba(255,200,80,.5),inset 0 0 2cqw rgba(255,200,80,.3);pointer-events:none}
.tap{position:absolute;z-index:4;top:5.5cqw;left:50%;transform:translateX(-50%);white-space:nowrap;padding:1.7cqw 5.6cqw;border-radius:99px;font:700 4.3cqw/1.1 var(--body);letter-spacing:.3cqw;color:var(--envDD);background:linear-gradient(var(--g2),var(--trim));box-shadow:0 1cqw 2.4cqw rgba(0,0,0,.45),inset 0 .3cqw 0 rgba(255,255,255,.6);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.07);box-shadow:0 1cqw 3.6cqw rgba(255,210,90,.85),inset 0 .3cqw 0 rgba(255,255,255,.6)}}
.cback{transform:rotateY(180deg);background:linear-gradient(135deg,var(--p1),var(--p2))}

.btn{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;font:700 17px/1 var(--body);letter-spacing:.06em;color:var(--g2);background:rgba(0,0,0,.45);border:1.5px solid var(--trim);border-radius:99px;padding:10px 22px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s ease}
.go .btn{opacity:1;pointer-events:auto;transition-delay:3.5s}
.closing .btn{opacity:0;pointer-events:none;transition-delay:0s}

.balloons{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.balloon{position:absolute;bottom:-130px;width:50px;height:62px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.7),transparent 32%),var(--c);box-shadow:inset -6px -8px 14px rgba(0,0,0,.2);animation:up var(--dur) ease-in var(--delay) forwards;opacity:0}
.balloon::before{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-5px;border:5px solid transparent;border-bottom:7px solid var(--c);border-top:0}
.balloon::after{content:'';position:absolute;left:50%;top:100%;width:1.5px;height:60px;background:rgba(255,255,255,.45);transform-origin:top;animation:str 2s ease-in-out infinite alternate}
@keyframes str{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes up{0%{opacity:1;transform:translate(0,0) scale(var(--s))}25%{transform:translate(18px,-32vh) scale(var(--s))}50%{transform:translate(-16px,-65vh) scale(var(--s))}75%{transform:translate(14px,-98vh) scale(var(--s))}100%{opacity:1;transform:translate(0,-140vh) scale(var(--s))}}
@media (prefers-reduced-motion:reduce){.env,.seal,.glow,.h1,.logo,.orb b,.stars i,.tap,.cfront::before{animation:none}.reveal,.letter,.flap,.cover{transition-duration:.01s;transition-delay:0s}.go .r,.go .w{animation-duration:.01s;animation-delay:0s}}
</style>
</head>

<script>
(function(){
var C=CONFIG,F=C.fx,K=C.colors,T=C.text,IMG=C.img||{};
var envMode=C.mode==='envelope';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nl(s){return esc(s).replace(/\n/g,'<br>');}
function hex2rgb(h){h=String(h).replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function shade(h,a){var c=hex2rgb(h),t=a<0?0:255,p=Math.abs(a);return 'rgb('+c.map(function(v){return Math.round(v+(t-v)*p);}).join(',')+')';}
function rgba(h,a){var c=hex2rgb(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function rnd(a,b){return a+Math.random()*(b-a);}

var R=document.documentElement.style;
R.setProperty('--bg1',shade(K.bg,.22));R.setProperty('--bg2',K.bg);R.setProperty('--bg3',shade(K.bg,-.7));
R.setProperty('--env',K.env);R.setProperty('--envD',shade(K.env,-.28));R.setProperty('--envDD',shade(K.env,-.6));R.setProperty('--envL',shade(K.env,.28));
R.setProperty('--trim',K.trim);R.setProperty('--g1',shade(K.trim,-.32));R.setProperty('--g2',shade(K.trim,.5));
R.setProperty('--p1',shade(K.paper,.55));R.setProperty('--p2',K.paper);
R.setProperty('--ink',K.ink);R.setProperty('--ring',rgba(K.ink,.3));
R.setProperty('--script',"'"+C.font.script+"','Brush Script MT','Segoe Script',cursive");
R.setProperty('--body',"'"+C.font.body+"',Georgia,'Times New Roman',serif");
document.title=C.title||'Interactive card';
document.body.className=envMode?'mode-envelope':'mode-book';

/* ---------- build the page ---------- */
var hasLogo=!!IMG.logo;
var showLogo=hasLogo&&C.showLogo;
var T0=envMode?2.3:1.0,t=T0;
function d(){var v=t;t+=.2;return 'style="--d:'+v.toFixed(2)+'s"';}
var P='';
if(showLogo){
  var orbs=F.orbit?'<div class="orb" style="--a:0deg;--dir:normal"><b></b></div><div class="orb" style="--a:60deg;--dir:reverse"><b></b></div><div class="orb" style="--a:120deg;--dir:normal"><b></b></div>':'';
  P+='<div class="logoWrap'+(F.orbit?'':' small')+' r" '+d()+'>'+orbs+'<div class="logo" id="paperLogo"></div></div>';
}else{P+='<div class="orn r" '+d()+'>&#10022; &#10022; &#10022;</div>';}
if(T.h1)P+='<div class="h1 r" '+d()+'>'+nl(T.h1)+'</div>';
if(T.h2){var hl=String(T.h2).length,hs=hl<=14?7:hl<=19?6:hl<=26?5:4.2;P+='<div class="h2 r" style="font-size:'+hs+'cqw;--d:'+(function(){var v=t;t+=.2;return v.toFixed(2);})()+'s">'+nl(T.h2)+'</div>';}
if(T.role)P+='<div class="role r" '+d()+'>'+esc(T.role)+'</div>';
if(T.date)P+='<div class="date r" '+d()+'>'+esc(T.date)+'</div>';
var quotes=[[T.q1Label,T.q1,T.q1By],[T.q2Label,T.q2,T.q2By]].filter(function(q){return q[1]&&String(q[1]).trim();});
var wi=0;
quotes.forEach(function(q,qi){
  P+='<div class="sep r" '+d()+'></div>';
  var body='';
  if(F.words){
    var ws=t;var words=String(q[1]).trim().split(/\s+/);
    body='<p class="q" style="--ws:'+ws.toFixed(2)+'s">'+words.map(function(w,i){return '<span class="w" style="--i:'+i+'">'+esc(w)+'</span>';}).join(' ')+'</p>';
    t=ws+words.length*.2+.5;
    P+='<div>'+(q[0]?'<div class="lab r" '+d()+'>'+esc(q[0])+'</div>':'')+body+(q[2]?'<div class="by r" style="--d:'+t.toFixed(2)+'s">'+esc(q[2])+'</div>':'')+'</div>';
    if(q[2])t+=.2;
  }else{
    P+='<div class="r" '+d()+'>'+(q[0]?'<div class="lab">'+esc(q[0])+'</div>':'')+'<p class="q">'+nl(q[1])+'</p>'+(q[2]?'<div class="by">'+esc(q[2])+'</div>':'')+'</div>';
  }
});
if(T.foot&&String(T.foot).trim()){P+='<div class="sep r" '+d()+'></div><div class="foot r" '+d()+'>'+nl(T.foot)+'</div>';}
var paper='<div class="paper">'+P+'</div>';

var H='';
if(F.stars)H+='<div class="stars" id="stars"></div>';
if(F.rays)H+='<div class="glow" id="glow"></div>';
H+='<canvas id="fx"></canvas><div class="flash"></div><div class="balloons" id="balloons"></div>';

if(envMode){
  var sh=function(a){return shade(K.env,a);};
  H+='<div class="stage" id="stage"><div class="sbw" id="sbw"><div class="scalebox" id="scalebox"><div class="env" id="env" role="button" tabindex="0" aria-label="Open the envelope"><div class="back"></div><div class="letter"></div>'
  +'<svg class="front" viewBox="0 0 320 220" aria-hidden="true"><defs>'
  +'<linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+sh(.06)+'"/><stop offset="1" stop-color="'+sh(-.2)+'"/></linearGradient>'
  +'<linearGradient id="gr" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+sh(.02)+'"/><stop offset="1" stop-color="'+sh(-.25)+'"/></linearGradient>'
  +'<linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+sh(.16)+'"/><stop offset="1" stop-color="'+sh(-.12)+'"/></linearGradient></defs>'
  +'<polygon points="0,0 160,122 0,220" fill="url(#gl)" stroke="'+K.trim+'" stroke-width="1.6" stroke-linejoin="round"/>'
  +'<polygon points="320,0 160,122 320,220" fill="url(#gr)" stroke="'+K.trim+'" stroke-width="1.6" stroke-linejoin="round"/>'
  +'<polygon points="0,220 160,112 320,220" fill="url(#gb)" stroke="'+K.trim+'" stroke-width="1.6" stroke-linejoin="round"/></svg>'
  +'<div class="flap"><svg viewBox="0 0 320 130" width="320" height="130" aria-hidden="true"><defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+sh(.24)+'"/><stop offset="1" stop-color="'+sh(-.02)+'"/></linearGradient></defs>'
  +'<polygon points="0,0 320,0 160,130" fill="url(#gf)" stroke="'+K.trim+'" stroke-width="1.6" stroke-linejoin="round"/></svg></div>'
  +'<span class="ring"></span><div class="seal" id="seal">'+(hasLogo?'':'&#10084;')+'</div></div></div></div>'
  +'<div class="hint" id="hint">'+esc(T.tap||'Tap the seal to open')+'</div></div>';
  H+='<div class="reveal" id="reveal">'+paper+'</div>';
}else{
  H+='<div class="reveal" id="reveal">'+paper
   +'<div class="cover" id="cover" role="button" tabindex="0" aria-label="Open the card"><div class="face cfront" id="coverFront">'+(IMG.cover?'':'<div class="ft">'+nl(T.h1||'')+'</div>')+'<div class="tap">&#127873; '+esc(T.tap||'Tap to open')+'</div></div><div class="face cback"></div></div></div>';
}
H+='<button class="btn" id="btn" type="button">Close</button>';
var app=document.getElementById('app');app.innerHTML=H;
function bg(id,url,zoom){var n=document.getElementById(id);if(n&&url){n.style.backgroundImage='url("'+url+'")';n.style.backgroundSize=zoom;}}
var Z=(IMG.zoom||100)+'%';
bg('paperLogo',IMG.logo,Z);
if(envMode){bg('seal',IMG.logo,Z);}else{bg('coverFront',IMG.cover,'cover');}

/* stars */
var stars=document.getElementById('stars');
if(stars){for(var i=0;i<48;i++){var s=document.createElement('i');s.style.left=rnd(0,100)+'%';s.style.top=rnd(0,100)+'%';s.style.animationDelay=rnd(0,3)+'s';s.style.animationDuration=(2+rnd(0,3))+'s';stars.appendChild(s);}}

var reveal=document.getElementById('reveal'),cover=document.getElementById('cover'),env=document.getElementById('env'),sc=document.getElementById('scalebox'),sbw=document.getElementById('sbw'),seal=document.getElementById('seal'),btn=document.getElementById('btn'),balloonBox=document.getElementById('balloons');
var cv=document.getElementById('fx'),ctx=cv.getContext('2d');
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
var isOpen=false,closing=false,timers=[],parts=[],raf=0,last=0,W=0,Hh=0,dpr=1,ambientUntil=0;
function later(fn,ms){timers.push(setTimeout(fn,ms));}

function fit(){
  var h=reveal.offsetHeight||540,kk=Math.min(1,(window.innerWidth-20)/400,(window.innerHeight-(envMode?120:110))/h);
  reveal.style.setProperty('--k',kk.toFixed(3));
  if(envMode){
    var k=Math.min(1,(window.innerWidth-24)/320,(window.innerHeight-140)/300);
    sc.style.transform='scale('+k+')';sbw.style.width=(320*k)+'px';sbw.style.height=(300*k)+'px';
    var r=sc.getBoundingClientRect(),s=r.width/320;
    reveal.style.setProperty('--tx',(r.left+160*s-window.innerWidth/2)+'px');
    reveal.style.setProperty('--ty',(r.top+74*s-window.innerHeight/2)+'px');
    reveal.style.setProperty('--ts',(280*s/400).toFixed(3));
  }
}
function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;Hh=window.innerHeight;cv.width=W*dpr;cv.height=Hh*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);fit();}
window.addEventListener('resize',size);size();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);

/* ---------- particles ---------- */
var CONF=['#ffd24a','#ff4d6d','#4dd2ff','#7cf29a','#ff9f43','#c77dff','#ffffff','#f7dc6f'];
function addC(x,y,vx,vy){parts.push({x:x,y:y,vx:vx,vy:vy,w:rnd(6,12),h:rnd(4,8),rot:rnd(0,6.28),vr:rnd(-.25,.25),tilt:rnd(0,6.28),vt:rnd(.08,.25),c:CONF[(Math.random()*CONF.length)|0],circ:Math.random()<.25});}
function addE(x,y,vx,vy,r,life){parts.push({e:1,x:x,y:y,vx:vx,vy:vy,r:r,life:life,max:life,ph:rnd(0,6.28),hue:rnd(38,52)});}
function cannon(x,y,deg,n,sp){for(var i=0;i<n;i++){var a=(deg+rnd(-24,24))*Math.PI/180,v=rnd(sp*.55,sp);addC(x,y,Math.cos(a)*v,-Math.sin(a)*v);}}
function radialC(x,y,n,sp){for(var i=0;i<n;i++){var a=rnd(0,6.283),v=rnd(sp*.3,sp);addC(x,y,Math.cos(a)*v,Math.sin(a)*v-3);}}
function rain(n){for(var i=0;i<n;i++)addC(rnd(0,W),rnd(-40,-8),rnd(-1.2,1.2),rnd(1,3));}
function burstE(x,y,n,sp){for(var i=0;i<n;i++){var a=rnd(0,6.283),v=rnd(sp*.25,sp);addE(x,y,Math.cos(a)*v,Math.sin(a)*v,rnd(1.2,3.2),rnd(60,120));}}
function loop(tm){
  var dt=Math.min(2.5,(tm-last)/16.67||1);last=tm;
  if(tm<ambientUntil&&Math.random()<.35)addE(rnd(0,W),Hh+10,rnd(-.3,.3),-rnd(1.2,2.4),rnd(1,2.4),rnd(200,300));
  ctx.clearRect(0,0,W,Hh);
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    if(p.e){
      p.life-=dt;if(p.life<=0||p.y<-20){parts.splice(i,1);continue;}
      p.vx*=Math.pow(.985,dt);p.vy=p.vy*Math.pow(.985,dt)-.004*dt;p.ph+=.05*dt;p.x+=(p.vx+Math.sin(p.ph)*.25)*dt;p.y+=p.vy*dt;
      var a=Math.min(1,p.life/p.max*1.6)*(.65+.35*Math.sin(p.ph*3));
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle='hsla('+p.hue+',100%,65%,'+(a*.25)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r*3.2,0,6.283);ctx.fill();
      ctx.fillStyle='hsla('+p.hue+',100%,78%,'+a+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();
    }else{
      p.vy+=.22*dt;p.vx*=Math.pow(.992,dt);p.vy*=Math.pow(.992,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.tilt+=p.vt*dt;
      if(p.y>Hh+30){parts.splice(i,1);continue;}
      ctx.globalCompositeOperation='source-over';
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1,Math.cos(p.tilt));ctx.fillStyle=p.c;
      if(p.circ){ctx.beginPath();ctx.arc(0,0,p.h*.6,0,6.283);ctx.fill();}else{ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);}
      ctx.restore();
    }
  }
  ctx.globalCompositeOperation='source-over';
  if(parts.length||tm<ambientUntil){raf=requestAnimationFrame(loop);}else{raf=0;ctx.clearRect(0,0,W,Hh);}
}
function kick(){if(!raf){last=performance.now();raf=requestAnimationFrame(loop);}}
function makeBalloons(){
  var bc=['#ff4d6d','#ffd24a','#4dd2ff','#7cf29a','#c77dff','#ff9f43','#ff6fb5'];
  for(var i=0;i<14;i++){
    var b=document.createElement('div');b.className='balloon';b.style.left=rnd(2,94)+'%';
    b.style.setProperty('--c',bc[i%bc.length]);b.style.setProperty('--s',rnd(.8,1.35).toFixed(2));
    b.style.setProperty('--dur',rnd(5,7.5).toFixed(1)+'s');b.style.setProperty('--delay',rnd(.3,2.6).toFixed(1)+'s');
    b.addEventListener('animationend',function(e){if(e.animationName==='up')this.remove();});
    balloonBox.appendChild(b);
  }
}
function celebrate(){
  var sp=Math.min(20,W/22)+6;
  if(F.confetti){cannon(0,Hh,66,70,sp);cannon(W,Hh,114,70,sp);radialC(W/2,Hh/2,80,sp*.7);}
  if(F.sparks){burstE(W/2,Hh/2,150,12);ambientUntil=performance.now()+9000;}
  if(F.balloons)makeBalloons();
  kick();
}

/* ---------- open and close ---------- */
var B=document.body;
function open(){
  if(isOpen||closing)return;isOpen=true;fit();
  B.classList.add('go');if(stars)stars.classList.add('on');
  if(reduce){B.classList.add('done');if(cover)cover.classList.add('gone');return;}
  if(envMode){
    if(F.sparks){var r=seal.getBoundingClientRect();burstE(r.left+r.width/2,r.top+r.height/2,40,5);kick();}
    later(function(){B.classList.add('done');celebrate();},2000);
    later(function(){if(F.confetti){for(var k=0;k<3;k++)later(function(){rain(24);kick();},k*600);}else if(F.sparks){burstE(W/2,Hh*.35,50,6);kick();}},3300);
  }else{
    later(function(){cover.classList.add('gone');},1300);
    later(celebrate,750);
    later(function(){if(F.confetti){for(var k=0;k<3;k++)later(function(){rain(24);kick();},k*600);}},2400);
  }
}
function close(){
  if(!isOpen||closing)return;closing=true;
  timers.forEach(clearTimeout);timers=[];parts.length=0;ambientUntil=0;fit();
  B.classList.add('closing');B.classList.remove('done');
  if(stars)stars.classList.remove('on');
  if(envMode){
    if(!reduce)later(function(){var r=sc.getBoundingClientRect(),s=r.width/320;burstE(r.left+160*s,r.top+120*s,28,3);kick();},850);
    later(function(){B.classList.remove('go');},900);
    later(function(){B.classList.remove('closing');isOpen=false;closing=false;},2900);
  }else{
    cover.classList.remove('gone');balloonBox.innerHTML='';
    later(function(){B.classList.remove('go');},500);
    later(function(){B.classList.remove('closing');isOpen=false;closing=false;},2400);
  }
}
var trigger=envMode?env:cover;
trigger.addEventListener('click',open);
trigger.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
btn.addEventListener('click',close);
btn.textContent=envMode?'Close & replay':'Close card';
if(C.autoOpen)setTimeout(open,500);
})();
</script>
