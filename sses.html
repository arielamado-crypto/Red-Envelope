html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% 30%,#10286e 0%,#081538 55%,#02050f 100%);font-family:'Cormorant Garamond',Georgia,serif;overflow:hidden;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.stars{position:fixed;inset:0;pointer-events:none}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#cfe3ff;opacity:.15;animation:tw 3s ease-in-out infinite}
.go .stars i,.stars.on i{opacity:.35}
@keyframes tw{50%{opacity:.95;transform:scale(1.7)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.stage{display:flex;flex-direction:column;align-items:center;gap:18px;position:relative;z-index:5}
.sbw{position:relative}
.scalebox{position:absolute;left:0;top:0;width:320px;height:300px;transform-origin:top left}

/* ===== envelope ===== */
.env{position:absolute;left:0;top:80px;width:320px;height:220px;perspective:900px;cursor:pointer;outline:none;animation:float 3.2s ease-in-out infinite;transition:transform .9s ease,opacity .9s ease}
.go .env{animation:none}
.done .env{transform:translateY(70px) scale(.8);opacity:0;pointer-events:none}
@keyframes float{50%{transform:translateY(-8px)}}
.back{position:absolute;inset:0;background:#0b1946;border-radius:6px;box-shadow:0 20px 34px rgba(0,0,0,.55),0 0 0 1.5px #c99a35}
.letter{position:absolute;left:20px;top:14px;width:280px;height:200px;z-index:2;background:linear-gradient(#fffdf4,#f8ecce);border-radius:4px;border:2px solid #d9a521;transition:transform .9s cubic-bezier(.3,1.15,.4,1) 1.05s}
.letter::after{content:'';position:absolute;left:34px;right:34px;top:70px;height:70px;background:repeating-linear-gradient(#c8b98a 0 2px,transparent 2px 14px);opacity:.55}
.go .letter{transform:translateY(-120px)}
.front,.flap{position:absolute;left:0;top:0;pointer-events:none}
.front{z-index:3;width:320px;height:220px}
.flap{z-index:4;width:320px;height:130px;transform-origin:top center;transition:transform .7s ease-in-out .4s,z-index 0s .7s;filter:drop-shadow(0 4px 3px rgba(0,0,0,.4))}
.flap svg{display:block}
.go .flap{transform:rotateX(180deg);z-index:1}
.seal{position:absolute;z-index:5;left:122px;top:92px;width:76px;height:76px;border-radius:50%;background:var(--logo) center/106% no-repeat #000;box-shadow:0 0 0 3px #e9c15a,0 0 0 5px #8a6414,0 6px 12px rgba(0,0,0,.6);transition:opacity .35s ease .4s,transform .35s ease .4s;animation:glow 2.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px #f6d77a,0 0 0 5px #8a6414,0 0 22px 6px rgba(255,215,110,.75),0 6px 12px rgba(0,0,0,.6)}}
.go .seal{opacity:0;transform:scale(.4);animation:none}
.ring{position:absolute;left:122px;top:92px;width:76px;height:76px;border-radius:50%;border:3px solid #ffe08a;z-index:5;opacity:0;pointer-events:none}
.go .ring{animation:ring 1.1s ease-out forwards}
@keyframes ring{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(5)}}
.hint{color:#bcd0ff;font-size:19px;letter-spacing:.05em;text-align:center;transition:opacity .4s}
.go .hint{opacity:0}

/* ===== reveal ===== */
.flash{position:fixed;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;pointer-events:none;opacity:0;z-index:20;background:radial-gradient(circle,#fff9d8 0%,rgba(255,214,110,.8) 35%,transparent 70%)}
.go .flash{animation:flash 1.5s ease-out 1.95s}
@keyframes flash{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(160)}}
.glow{position:fixed;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;z-index:2;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg,rgba(255,214,110,.13) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 42%);mask:radial-gradient(circle,#000 0,transparent 42%);animation:spin 60s linear infinite}
.go .glow{opacity:1;transition:opacity 2s ease 2.1s}
@keyframes spin{to{transform:rotate(360deg)}}
.reveal{position:fixed;left:50%;top:50%;z-index:30;width:min(90vw,400px,calc((100svh - 124px)/1.42));aspect-ratio:1/1.42;margin:0;transform:translate(-50%,-46%) scale(.55);opacity:0;pointer-events:none;container-type:inline-size;transition:transform 1s cubic-bezier(.2,1.1,.3,1) 2s,opacity .7s ease 2s}
.go .reveal{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.paper{position:absolute;inset:0;border-radius:2.4cqw;background:radial-gradient(circle at 50% 0%,#fffef8 0%,#fbf0d6 100%);box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 0 .5cqw #d9a521,0 0 8cqw rgba(255,214,110,.35);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:7cqw 9cqw;gap:2.6cqw;color:var(--navy)}
.paper::after{content:'';position:absolute;inset:2.2cqw;border:.4cqw solid #d9a521;border-radius:1.4cqw;box-shadow:inset 0 0 0 1cqw #fff9e8,inset 0 0 0 1.35cqw rgba(217,165,33,.55);pointer-events:none}
.paper>*{position:relative;z-index:1}
.r{opacity:0}
.go .r{animation:rise .9s cubic-bezier(.2,.8,.25,1) var(--d) both}
@keyframes rise{0%{opacity:0;transform:translateY(4cqw) scale(.95);filter:blur(4px)}100%{opacity:1;transform:none;filter:none}}
.logoWrap{position:relative;width:46cqw;height:46cqw;display:grid;place-items:center;margin-top:-1cqw}
.logo{width:26cqw;height:26cqw;border-radius:50%;background:var(--logo) center/106% no-repeat #000;box-shadow:0 0 0 .6cqw #e9c15a,0 0 0 1cqw #8a6414,0 1cqw 3cqw rgba(20,40,107,.45)}
.go .logo{animation:lg 2.4s ease-in-out 3.2s infinite}
@keyframes lg{50%{box-shadow:0 0 0 .6cqw #f6d77a,0 0 0 1cqw #8a6414,0 0 6cqw 1.5cqw rgba(255,200,70,.8)}}
.orb{position:absolute;inset:0;transform:rotate(var(--a)) scaleY(.36);pointer-events:none}
.orb b{position:absolute;inset:0;border-radius:50%;border:.35cqw solid rgba(30,70,170,.35);animation:spin 7s linear infinite;animation-direction:var(--dir)}
.orb b::after{content:'';position:absolute;left:50%;top:-1.5cqw;width:3.2cqw;height:3.2cqw;margin-left:-1.6cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#2d6bd8 60%);box-shadow:0 0 2cqw #4a8bff}
.wel{font-family:'Great Vibes','Brush Script MT','Segoe Script',cursive;font-size:15cqw;line-height:.9;margin:-3cqw 0 0;background:linear-gradient(100deg,#9a6a06 10%,#f7dc6f 38%,#b8860b 58%,#f7dc6f 80%,#9a6a06 95%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4.5s linear infinite}
@keyframes shine{to{background-position:-220% 0}}
.fam{font-weight:700;font-size:7.4cqw;letter-spacing:1.2cqw;text-transform:uppercase;line-height:1;margin-top:-.5cqw}
.sep{width:38cqw;height:.4cqw;background:linear-gradient(90deg,transparent,#d9a521,transparent)}
.q{font-style:italic;font-weight:600;font-size:4.7cqw;line-height:1.3;margin:0}
.w{display:inline-block;opacity:.16;filter:blur(1.2px)}
.go .w{animation:lit .75s ease forwards;animation-delay:calc(3.1s + var(--i)*.2s)}
@keyframes lit{0%{opacity:.16;filter:blur(1.2px)}45%{opacity:1;filter:none;color:#b8860b;text-shadow:0 0 3cqw rgba(255,196,60,.95)}100%{opacity:1;filter:none;color:var(--navy);text-shadow:none}}
.foot{font-size:2.9cqw;letter-spacing:.35cqw;text-transform:uppercase;font-weight:700;color:#9a6c10;line-height:1.5}

.btn{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;font:700 17px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.06em;color:#ffe9a8;background:rgba(8,21,56,.7);border:1.5px solid #c8921a;border-radius:99px;padding:10px 22px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s ease}
.go .btn{opacity:1;pointer-events:auto;transition-delay:4s}
@media (prefers-reduced-motion:reduce){.env,.seal,.glow,.wel,.logo,.orb b,.stars i{animation:none}.reveal,.letter,.flap{transition-duration:.01s;transition-delay:0s}.go .r,.go .w{animation-duration:.01s;animation-delay:0s}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="glow" id="glow"></div>
<canvas id="fx"></canvas>
<div class="flash"></div>

<div class="stage" id="stage">
  <div class="sbw" id="sbw">
    <div class="scalebox" id="scalebox">
      <div class="env" id="env" role="button" tabindex="0" aria-label="Open the envelope">
        <div class="back"></div>
        <div class="letter"></div>
        <svg class="front" viewBox="0 0 320 220" aria-hidden="true">
          <defs>
            <linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d3f9c"/><stop offset="1" stop-color="#13286f"/></linearGradient>
            <linearGradient id="gr" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b3b94"/><stop offset="1" stop-color="#122668"/></linearGradient>
            <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2652bb"/><stop offset="1" stop-color="#16307f"/></linearGradient>
          </defs>
          <polygon points="0,0 160,122 0,220" fill="url(#gl)" stroke="#e0b04a" stroke-width="1.6" stroke-linejoin="round"/>
          <polygon points="320,0 160,122 320,220" fill="url(#gr)" stroke="#e0b04a" stroke-width="1.6" stroke-linejoin="round"/>
          <polygon points="0,220 160,112 320,220" fill="url(#gb)" stroke="#e0b04a" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <div class="flap"><svg viewBox="0 0 320 130" width="320" height="130" aria-hidden="true">
          <defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d5ccc"/><stop offset="1" stop-color="#1a3c9a"/></linearGradient></defs>
          <polygon points="0,0 320,0 160,130" fill="url(#gf)" stroke="#e0b04a" stroke-width="1.6" stroke-linejoin="round"/>
        </svg></div>
        <span class="ring"></span>
        <div class="seal" id="seal"></div>
      </div>
    </div>
  </div>
  <div class="hint" id="hint">Tap the seal to open</div>
</div>

<div class="reveal" id="reveal" aria-live="polite">
  <div class="paper">
    <div class="logoWrap r" style="--d:2.3s">
      <div class="orb" style="--a:0deg;--dir:normal"><b></b></div>
      <div class="orb" style="--a:60deg;--dir:reverse"><b></b></div>
      <div class="orb" style="--a:120deg;--dir:normal"><b></b></div>
      <div class="logo"></div>
    </div>
    <div class="wel r" style="--d:2.6s">Welcome</div>
    <div class="fam r" style="--d:2.8s">SSES Family</div>
    <div class="sep r" style="--d:2.95s"></div>
    <p class="q" id="quote" aria-label="The true measure of an SSES teacher is not the facts taught, but the curiosity awakened in every child."></p>
    <div class="sep r" style="--d:6s"></div>
    <div class="foot r" style="--d:6.2s">Special Science Elementary School<br>Estancia, Iloilo</div>
  </div>
</div>
<button class="btn" id="btn" type="button">Close &amp; replay</button>

<script>
(function(){
  var stage=document.getElementById('stage'),env=document.getElementById('env'),sbw=document.getElementById('sbw'),sc=document.getElementById('scalebox'),seal=document.getElementById('seal'),btn=document.getElementById('btn'),quote=document.getElementById('quote'),stars=document.getElementById('stars');
  var cv=document.getElementById('fx'),ctx=cv.getContext('2d');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var isOpen=false,timers=[],parts=[],raf=0,last=0,W=0,H=0,dpr=1,ambientUntil=0;
  function rnd(a,b){return a+Math.random()*(b-a);}
  function later(fn,ms){timers.push(setTimeout(fn,ms));}

  /* the quote, one word at a time */
  var text='“The true measure of an SSES teacher is not the facts taught, but the curiosity awakened in every child.”';
  text.split(' ').forEach(function(w,i){var s=document.createElement('span');s.className='w';s.style.setProperty('--i',i);s.textContent=w;quote.appendChild(s);quote.appendChild(document.createTextNode(' '));});

  for(var i=0;i<48;i++){var s=document.createElement('i');s.style.left=rnd(0,100)+'%';s.style.top=rnd(0,100)+'%';s.style.animationDelay=rnd(0,3)+'s';s.style.animationDuration=(2+rnd(0,3))+'s';stars.appendChild(s);}

  function fit(){
    var k=Math.min(1,(window.innerWidth-24)/320,(window.innerHeight-140)/300);
    sc.style.transform='scale('+k+')';sbw.style.width=(320*k)+'px';sbw.style.height=(300*k)+'px';
  }
  function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);fit();}
  window.addEventListener('resize',size);size();

  /* golden sparks */
  function add(x,y,vx,vy,r,life){parts.push({x:x,y:y,vx:vx,vy:vy,r:r,life:life,max:life,ph:rnd(0,6.28),hue:rnd(38,52)});}
  function burst(x,y,n,sp){for(var i=0;i<n;i++){var a=rnd(0,6.283),v=rnd(sp*.25,sp);add(x,y,Math.cos(a)*v,Math.sin(a)*v,rnd(1.2,3.2),rnd(60,120));}}
  function loop(t){
    var dt=Math.min(2.5,(t-last)/16.67||1);last=t;
    if(t<ambientUntil){if(Math.random()<.35)add(rnd(0,W),H+10,rnd(-.3,.3),-rnd(1.2,2.4),rnd(1,2.4),rnd(200,300));}
    ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];p.life-=dt;
      if(p.life<=0||p.y<-20){parts.splice(i,1);continue;}
      p.vx*=Math.pow(.985,dt);p.vy=p.vy*Math.pow(.985,dt)-.004*dt;
      p.ph+=.05*dt;p.x+=(p.vx+Math.sin(p.ph)*.25)*dt;p.y+=p.vy*dt;
      var a=Math.min(1,p.life/p.max*1.6)*(.65+.35*Math.sin(p.ph*3));
      ctx.fillStyle='hsla('+p.hue+',100%,65%,'+(a*.25)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r*3.2,0,6.283);ctx.fill();
      ctx.fillStyle='hsla('+p.hue+',100%,78%,'+a+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
    if(parts.length||t<ambientUntil){raf=requestAnimationFrame(loop);}else{raf=0;ctx.clearRect(0,0,W,H);}
  }
  function kick(){if(!raf){last=performance.now();raf=requestAnimationFrame(loop);}}

  function open(){
    if(isOpen)return;isOpen=true;
    stage.classList.add('go');document.body.classList.add('go');stars.classList.add('on');
    env.setAttribute('aria-label','Envelope opened');
    if(!reduce){
      var r=seal.getBoundingClientRect();
      burst(r.left+r.width/2,r.top+r.height/2,40,5);kick();
      later(function(){document.body.classList.add('done');},2000);
      later(function(){burst(W/2,H/2,150,12);ambientUntil=performance.now()+9000;kick();},2000);
      later(function(){burst(W/2,H*.35,50,6);kick();},3600);
    }else{document.body.classList.add('done');}
  }
  function close(){
    isOpen=false;timers.forEach(clearTimeout);timers=[];
    document.body.classList.remove('go','done');stage.classList.remove('go');stars.classList.remove('on');
    parts.length=0;ambientUntil=0;
    env.setAttribute('aria-label','Open the envelope');
  }
  env.addEventListener('click',open);
  env.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
  btn.addEventListener('click',close);
})();
</script>
</body>
</html>
